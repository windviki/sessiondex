[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sessiondex"
version = "0.1.0"
description = "Local full-text index & search service over AI coding-agent session histories (Claude Code, ZCode, Kimi Code, dsh, Qoder, OpenCode)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai-agents", "mcp", "full-text-search", "claude-code", "opencode", "session-history"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "typer>=0.12",
  "rich>=13.7",
  "orjson>=3.10",
  "zstandard>=0.22",
  "mcp>=1.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
sessiondex = "sessiondex.cli:main"

[project.urls]
Homepage = "https://github.com/windviki/sessiondex"

[tool.hatch.build.targets.wheel]
packages = ["src/sessiondex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/sessiondex"]
